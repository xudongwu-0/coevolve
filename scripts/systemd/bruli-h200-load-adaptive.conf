[Unit]
RequiresMountsFor=/mnt/3fs/xudong/coevolve

[Service]
Environment=PYTHONPATH=/mnt/3fs/xudong/coevolve/whale_local
Environment=COEVOLVE_GPU_FILLER_VENDOR=/mnt/3fs/models/bruli/gpu-utilization-20260925/vendor
Environment=COEVOLVE_GPU_FILLER_RESERVATION=/mnt/3fs/models/bruli/gpu-utilization-20260925/nodes/%H/reservation.json
ExecStart=
ExecStart=/usr/bin/python3 -B -m sao_bridge.adaptive_gpu_filler supervisor
KillMode=control-group
TimeoutStopSec=20
